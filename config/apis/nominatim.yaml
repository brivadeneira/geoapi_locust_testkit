api:
  base_url: https://nominatim.openstreetmap.org

  endpoints:
    - name: search
      path: /search
      method: GET
      params:
        q: "{{ address }}"
        format: jsonv2
        limit: 1

    - name: reverse
      path: /reverse
      method: GET
      params:
        lat: "{{ latitude }}"
        lon: "{{ longitude }}"
        format: jsonv2

      bbox:
        xmin: -9.5
        ymin: 36.9
        xmax: -6.1
        ymax: 42.2
